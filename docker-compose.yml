# Bridge Inventory — Docker Compose (Snipe-IT fork)
# Services: app (snipe/snipe-it), db (mariadb), mailpit (local SMTP + UI)
#
# Default: official image pinned via APP_VERSION in .env
# Mode B local customize:
#   1. docker build -t bridge-inventory:local .
#   2. Change app.image below to bridge-inventory:local (or uncomment build:)
#   3. docker compose up -d

volumes:
  db_data:
  storage:

services:
  app:
    image: snipe/snipe-it:${APP_VERSION:-v8.7.2}
    # Mode B — build from local Dockerfile instead of Hub image:
    # build: .
    # image: bridge-inventory:local
    restart: unless-stopped
    volumes:
      - storage:/var/lib/snipeit
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      mailpit:
        condition: service_started
    env_file:
      - .env
    networks:
      - bridge-inventory

  db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      # https://mariadb.com/kb/en/using-healthcheck-sh/#compose-file-example
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 1s
      retries: 5
    networks:
      - bridge-inventory

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - bridge-inventory

networks:
  bridge-inventory:
    driver: bridge
